<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8ff" />
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem('nexwork:theme');
          const theme = stored === 'dark' ? 'dark' : 'light';
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#07111f' : '#f4f8ff');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!-- Inline so no separate request is made and the browser stops requesting /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 7l2.2 5.1L23.5 14l-5.3 1.9L16 21l-2.2-5.1L8.5 14l5.3-1.9z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Nexwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
